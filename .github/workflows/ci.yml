name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "ci/**"

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 23
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "23"
          cache: maven

      - name: Build and test
        shell: bash
        run: mvn -U -B -ntp test

      - name: Native OGR curve pipeline E2E
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: >-
          mvn -U -B -ntp
          -pl hop-transform-ogr-exporter -am
          -Pnative-e2e-linux-x86_64
          -Dhop.gdal.native.e2e=true
          -Dtest=OgrCurvePipelineE2eTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  windows-distribution-smoke:
    name: Windows packaged vector smoke (${{ matrix.label }})
    runs-on: windows-2025
    timeout-minutes: 30
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: temurin-23, distribution: temurin, java-version: '23', allow_failure: false }
          - { label: temurin-24, distribution: temurin, java-version: '24', allow_failure: false }
          - { label: oracle-24.0.2-known-incompatibility, distribution: oracle, java-version: '24.0.2', allow_failure: true }
          - { label: temurin-25, distribution: temurin, java-version: '25', allow_failure: false }
          - { label: oracle-25, distribution: oracle, java-version: '25', allow_failure: false }

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up ${{ matrix.distribution }} JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Verify selected Java runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          command -v java
          java --version
          "$JAVA_HOME/bin/java" --version

      - name: Build Windows vector distribution ZIP
        shell: bash
        run: >-
          mvn -U -B -ntp
          -DskipTests
          -pl assemblies/assemblies-vector-suite-windows-x86_64
          -am
          package

      - name: Extract packaged Windows vector distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zips = @(Get-ChildItem 'assemblies/assemblies-vector-suite-windows-x86_64/target/*.zip')
          if ($zips.Count -ne 1) {
            throw "Expected exactly one Windows vector distribution ZIP, found $($zips.Count): $($zips.FullName -join ', ')"
          }
          $target = Join-Path $PWD 'build/windows-vector-distribution-smoke'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath $target -Force
          "SMOKE_DIST=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SMOKE_ZIP=$($zips[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate exact packaged classpath
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:SMOKE_DIST 'plugins/transforms/gdal-suite'
          $lib = Join-Path $root 'lib'
          if (-not (Test-Path $root)) { throw "Missing packaged plugin directory: $root" }
          if (-not (Test-Path $lib)) { throw "Missing packaged lib directory: $lib" }

          $reader = @(Get-ChildItem $root -Filter 'hop-transform-ogr-reader-*.jar')
          $exporter = @(Get-ChildItem $root -Filter 'hop-transform-ogr-exporter-*.jar')
          if ($reader.Count -ne 1) { throw "Expected exactly one OGR reader jar, found $($reader.Count)" }
          if ($exporter.Count -ne 1) { throw "Expected exactly one OGR exporter jar, found $($exporter.Count)" }

          # The assembly intentionally strips dependency versions in lib via outputFileNameMapping.
          $expectedLibs = @(
            'gdal-ffm-core.jar',
            'gdal-ffm-natives-swiss-natives-windows-x86_64.jar',
            'hop-ogr-core.jar'
          )
          $actualLibs = @(Get-ChildItem $lib -File -Filter '*.jar' | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedSorted = @($expectedLibs | Sort-Object)
          if (($actualLibs -join "`n") -ne ($expectedSorted -join "`n")) {
            throw "Unexpected packaged lib classpath. Expected: $($expectedSorted -join ', '); actual: $($actualLibs -join ', ')"
          }

          Write-Host "ZIP=$env:SMOKE_ZIP"
          Write-Host "reader=$($reader[0].FullName)"
          Write-Host "exporter=$($exporter[0].FullName)"
          foreach ($jar in $actualLibs) { Write-Host "lib=$jar" }

      - name: Create OGR smoke dataset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sample = Join-Path $env:SMOKE_DIST 'smoke.geojson'
          @'
          {
            "type": "FeatureCollection",
            "features": [
              {
                "type": "Feature",
                "properties": { "name": "smoke", "value": 42 },
                "geometry": { "type": "Point", "coordinates": [7.4386, 46.9511] }
              }
            ]
          }
          '@ | Set-Content -Encoding utf8 $sample
          "SMOKE_DATASET=$sample" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run OGR smoke from extracted distribution twice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginRoot = Join-Path $env:SMOKE_DIST 'plugins/transforms/gdal-suite'
          $classpath = "$pluginRoot/*;$pluginRoot/lib/*"
          $tmp = Join-Path $env:SMOKE_DIST 'tmp'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $source = Join-Path $PWD 'tools/smoke/WindowsVectorDistributionSmoke.java'

          for ($i = 1; $i -le 2; $i++) {
            Write-Host "=== packaged OGR smoke run $i ==="
            & "$env:JAVA_HOME/bin/java.exe" `
              --enable-native-access=ALL-UNNAMED `
              "-Djava.io.tmpdir=$tmp" `
              "-XX:ErrorFile=$env:SMOKE_DIST/hs_err_pid%p.log" `
              -cp $classpath `
              $source `
              $env:SMOKE_DATASET
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged OGR smoke run $i failed with exit code $LASTEXITCODE"
            }
          }

      - name: Record Java, package and CRT identities
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $diagnostics = Join-Path $PWD 'build/windows-vector-distribution-smoke-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          $report = Join-Path $diagnostics 'runtime-and-crt.txt'

          function Write-Line([string]$Text = '') {
            $Text | Tee-Object -FilePath $report -Append
          }

          function Write-DllIdentity([string]$Scope, [System.IO.FileInfo]$File) {
            if ($null -eq $File -or -not $File.Exists) { return }
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($File.FullName)
            $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $File.FullName).Hash
            Write-Line "scope=$Scope"
            Write-Line "path=$($File.FullName)"
            Write-Line "fileVersion=$($info.FileVersion)"
            Write-Line "productVersion=$($info.ProductVersion)"
            Write-Line "length=$($File.Length)"
            Write-Line "sha256=$sha"
            Write-Line
          }

          Write-Line '=== Java runtime ==='
          Write-Line "JAVA_HOME=$env:JAVA_HOME"
          Write-Line "matrix=${{ matrix.label }}"
          (& "$env:JAVA_HOME/bin/java.exe" --version 2>&1) | ForEach-Object { Write-Line $_ }
          Write-Line

          Write-Line '=== Packaged artifacts ==='
          if ($env:SMOKE_ZIP -and (Test-Path $env:SMOKE_ZIP)) {
            Write-Line "zip=$env:SMOKE_ZIP"
            Write-Line "zipSha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $env:SMOKE_ZIP).Hash)"
          }
          if ($env:SMOKE_DIST -and (Test-Path $env:SMOKE_DIST)) {
            Get-ChildItem -LiteralPath $env:SMOKE_DIST -Recurse -File -Filter '*.jar' -ErrorAction SilentlyContinue |
              Sort-Object FullName |
              ForEach-Object {
                Write-Line "jar=$($_.FullName)"
                Write-Line "jarSha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash)"
              }
          }
          Write-Line

          Write-Line '=== JDK CRT ==='
          Get-ChildItem -LiteralPath (Join-Path $env:JAVA_HOME 'bin') -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'msvcp140*.dll' -or $_.Name -like 'vcruntime140*.dll' } |
            Sort-Object Name |
            ForEach-Object { Write-DllIdentity 'jdk' $_ }

          Write-Line '=== Extracted GDAL CRT ==='
          if ($env:SMOKE_DIST) {
            $tmpRoot = Join-Path $env:SMOKE_DIST 'tmp/gdal-ffm'
            if (Test-Path $tmpRoot) {
              Get-ChildItem -LiteralPath $tmpRoot -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like 'msvcp140*.dll' -or $_.Name -like 'vcruntime140*.dll' } |
                Sort-Object FullName -Unique |
                ForEach-Object { Write-DllIdentity 'gdal-bundle' $_ }
            } else {
              Write-Line "No extracted GDAL tree found at $tmpRoot"
            }
          }

      - name: Document known Oracle 24.0.2 incompatibility
        if: ${{ always() && matrix.allow_failure }}
        shell: pwsh
        run: |
          @"
          ### Known incompatibility: Oracle JDK 24.0.2 on Windows

          This matrix entry is intentionally allowed to fail.

          The packaged OGR smoke currently reproduces an
          `EXCEPTION_ACCESS_VIOLATION` in `msvcp140.dll` during `GDALAllRegister()`.
          The entry remains in CI so the incompatibility stays visible and is
          automatically retested on future changes.
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Dump Windows smoke diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          & "$env:JAVA_HOME/bin/java.exe" --version
          Write-Host "SMOKE_ZIP=$env:SMOKE_ZIP"
          Write-Host "--- fatal JVM logs ---"
          Get-ChildItem -Recurse $env:SMOKE_DIST -Filter 'hs_err_pid*.log' -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "### $($_.FullName)"
            Get-Content $_.FullName
          }
          Write-Host "--- relevant extracted native files ---"
          $tmpRoot = Join-Path $env:SMOKE_DIST 'tmp/gdal-ffm'
          if (Test-Path $tmpRoot) {
            Get-ChildItem -Recurse $tmpRoot -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -eq 'manifest.json' -or
                $_.Name -eq 'gdal.dll' -or
                $_.Name -eq 'proj_9.dll' -or
                $_.Name -like 'msvcp140*.dll' -or
                $_.Name -like 'vcruntime140*.dll'
              } |
              ForEach-Object { Write-Host "$($_.FullName) [$($_.Length)]" }
          }

      - name: Upload Windows smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hop-windows-distribution-smoke-${{ matrix.label }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/windows-vector-distribution-smoke/hs_err_pid*.log
            build/windows-vector-distribution-smoke-diagnostics/**
