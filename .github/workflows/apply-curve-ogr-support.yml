name: apply-curve-ogr-support

on:
  push:
    branches:
      - agent/true-curve-ogr-roundtrip

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message != 'Integrate true curve WKB into OGR transforms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/true-curve-ogr-roundtrip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Patch OGR reader and exporter
        run: python .github/curve_ogr_patch.py

      - name: Run Maven tests
        run: mvn -U -B -ntp test

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hop-transform-ogr-reader/src/main/java/ch/so/agi/hop/gdal/transform/ogrinput/OgrInput.java
          git add hop-transform-ogr-exporter/src/main/java/ch/so/agi/hop/gdal/transform/ogroutput/OgrOutput.java
          git commit -m 'Integrate true curve WKB into OGR transforms'
          git push
